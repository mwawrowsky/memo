<mat-card appearance="outlined" class="intro">
  <mat-card-header>
    <h1 mat-card-title>Memo Game</h1>
  </mat-card-header>
  <mat-card-content>
    <p>Memorize the order of the displayed icons and their background colors.</p>
  </mat-card-content>
  <mat-card-actions>
    <button matButton="filled" (click)="startTraining()">
      <mat-icon aria-hidden="true">play_arrow</mat-icon>
      Begin
    </button>
  </mat-card-actions>
</mat-card>
