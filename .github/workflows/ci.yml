name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# Cancel superseded runs for the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx ng lint

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build
